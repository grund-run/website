[package]
name = "grund-website"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "The server behind grund.sh: serves a static site embedded at build time"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
notmad = "0.14"
percent-encoding = "2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[build-dependencies]
brotli = "9"
flate2 = "1"
sha2 = "0.11"

[dev-dependencies]
http-body-util = "0.1"
# The accepttests speak raw HTTP/1.1 so that what they assert is what went over
# the wire: traversal probes are sent unnormalised, and a HEAD body would be
# seen. TLS is for running them against a live https origin. ring, not the
# aws-lc-rs default, because aws-lc-rs needs cmake to build on alpine.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
