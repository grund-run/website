[package]
name = "grund-website"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "The server behind grund.run: serves a static site embedded at build time"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
notmad = "0.14"
percent-encoding = "2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[build-dependencies]
brotli = "9"
flate2 = "1"
sha2 = "0.11"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
