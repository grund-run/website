# Every gate, and the image, in one workflow, so the steps share one
# workspace and run side by side:
#
#   lint ────────────────┐
#   test ────┐           ├─ image-publish (push to main) / image-dry-run (PR)
#   release ─┴─ contract ┘
#
# `test` runs the unit tests and the accepttests against a binary cargo
# spawns. `release` builds the static binary that ships. `contract` runs the
# accepttest binary `test` already compiled against that staged release
# binary, so the artifact that ships is the one the accepttests assert
# against, and the accepttests are compiled once. The image is published only
# when every gate passed.
#
# Required Woodpecker secret (push to main only; pull requests use none):
#   registry_token: a git.kjuulh.io token with package write access to the
#   grund organisation.
#   ci_cache_public (organisation secret): the shared CI cache's public
#   write key, held only by the generated cache-save step.
#
# One immutable tag, main-${CI_COMMIT_SHA}. kjuulh/woodpecker-forest computes
# exactly that tag from the commit and pins the release to it, so a rollout
# cannot find its image if this tag stops being published. There is no latest
# or main tag: a moving tag gives a rollback nothing to roll back to.

# A push or pull request that changes only documentation (*.md)
# runs nothing: no build reads those files. Woodpecker then also drops
# rollout.yaml, which depends on this workflow, so no release is staged for
# an image that was not built (checked on grund/fleet branch ci/pathtest,
# 2026-09-26). The next change to anything else tests the whole tree.
when:
  - event: push
    branch: main
    path:
      exclude: ["*.md"]
  - event: pull_request
    path:
      exclude: ["*.md"]
  - event: manual

labels:
  platform: linux/amd64

steps:
  lint:
    # The same image the shipped binary is built in, so a toolchain
    # difference cannot pass here and fail there. Its own target directory:
    # cargo locks a target directory per build, and lint runs beside test.
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target/lint
    commands:
      - apk add --no-cache musl-dev sccache
      - rustup component add rustfmt clippy
      - 'command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl 2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl; else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl; fi; } 2>/dev/null) && echo "9a8b7b692aaf73f6499de5bca19f15f7609783db03b65bdca252127fea17d36a  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part && mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached"; }'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then ci-cache restore lint --preset cargo; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then eval "$$(ci-cache env)"; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      - cargo fmt --all --check
      - cargo clippy --all-targets --locked -- -D warnings
      - 'if command -v ci-cache >/dev/null; then ci-cache stats; fi'  # ci-cache: managed by kjuulh/woodpecker-forest

  test:
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      # The image's own toolchain, so rustup does not read rust-toolchain.toml
      # and fetch clippy and rustfmt over the network in a step that never
      # lints (mail pipeline 7 failed on exactly that download).
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
      # A CI build is never rebuilt incrementally, so writing incremental
      # state is pure cost; and full debuginfo makes the test binaries
      # slower to compile and link, while line tables keep file:line in a
      # panic's backtrace. Neither changes what the code does, and neither
      # reaches `release`.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    commands:
      - apk add --no-cache musl-dev sccache
      - 'command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl 2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl; else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl; fi; } 2>/dev/null) && echo "9a8b7b692aaf73f6499de5bca19f15f7609783db03b65bdca252127fea17d36a  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part && mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached"; }'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then ci-cache restore test --preset cargo; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then eval "$$(ci-cache env)"; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      # Build every test binary first, and keep the accepttest binary:
      # `contract` runs that same file against the release binary. The same
      # invocation as the run below, so the run compiles nothing.
      - mkdir -p .accept
      - cargo test --locked --no-run --message-format=json-render-diagnostics > .accept/build.json
      - grep '"reason":"compiler-artifact"' .accept/build.json | grep '"kind":\["test"\]' | grep '"name":"tests"' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' > .accept/path
      - test "$$(wc -l < .accept/path)" -eq 1 || { echo "expected one accepttest binary, found:"; cat .accept/path; exit 1; }
      - cp "$$(cat .accept/path)" .accept/tests
      - cargo test --locked
      - 'if command -v ci-cache >/dev/null; then ci-cache stats; fi'  # ci-cache: managed by kjuulh/woodpecker-forest

  release:
    # rust:*-alpine targets musl natively: the release binary is static, which
    # is what lets it run on scratch. build.rs compiles CI_COMMIT_SHA into
    # /health/ready as "revision".
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      # The image's own toolchain, so rustup does not read rust-toolchain.toml
      # and fetch clippy and rustfmt over the network in a step that never
      # lints (mail pipeline 7 failed on exactly that download).
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
      CARGO_INCREMENTAL: "0"
      # Its own target directory: release runs beside test, and each restores
      # and saves its own cache snapshot.
      CARGO_TARGET_DIR: target/release-build
    commands:
      - apk add --no-cache musl-dev binutils sccache
      - 'command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl 2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl; else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl; fi; } 2>/dev/null) && echo "9a8b7b692aaf73f6499de5bca19f15f7609783db03b65bdca252127fea17d36a  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part && mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached"; }'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then ci-cache restore release --preset cargo; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then eval "$$(ci-cache env)"; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      - cargo build --locked --release
      - if readelf -d target/release-build/release/grund-website | grep -q NEEDED; then echo "grund-website is dynamically linked; scratch cannot run it"; exit 1; fi
      # A compile cache must never ship another commit's build: the binary
      # has to carry this commit's revision (build.rs, /health/ready).
      - tr -c 0-9a-f "\n" < target/release-build/release/grund-website | grep -q "$${CI_COMMIT_SHA}" || { echo "grund-website does not carry revision $${CI_COMMIT_SHA}"; exit 1; }
      # Stage the binary first and run the staged file, so the process the
      # accepttests assert against is byte for byte the one that gets packaged.
      - mkdir -p .image && cp target/release-build/release/grund-website .image/grund-website
      - 'if command -v ci-cache >/dev/null; then ci-cache stats; fi'  # ci-cache: managed by kjuulh/woodpecker-forest

  contract:
    # The accepttest binary `test` compiled and ran against a spawned binary,
    # pointed at the staged release binary. The harness is a black-box HTTP
    # client, so it does not need to be compiled in release itself.
    image: rust:1.98.1-alpine3.24
    depends_on: [test, release]
    commands:
      - GRUND_WEBSITE_LISTEN=127.0.0.1:8080 GRUND_WEBSITE_REDIRECT_HOSTS=www.grund.sh ./.image/grund-website > server.log 2>&1 &
      - GRUND_WEBSITE_ACCEPT_URL=http://127.0.0.1:8080 GRUND_WEBSITE_ACCEPT_REDIRECT_HOST=www.grund.sh ./.accept/tests || { echo "--- server log"; cat server.log; exit 1; }

  # A broken Dockerfile fails the pull request that broke it, not the next
  # push to main. Builds, never pushes, and needs no secret.
  image-dry-run:
    image: woodpeckerci/plugin-docker-buildx:5
    depends_on: [lint, contract]
    when:
      - event: pull_request
    settings:
      dockerfile: Dockerfile.prebuilt
      context: .image
      repo: git.kjuulh.io/grund/website
      platforms: linux/amd64
      dry_run: true
      auto_tag: false
      tags: ci-${CI_COMMIT_SHA_SHORT}

  image-publish:
    image: woodpeckerci/plugin-docker-buildx:5
    depends_on: [lint, contract]
    when:
      - event: push
        branch: main
      - event: manual
    settings:
      registry: git.kjuulh.io
      repo: git.kjuulh.io/grund/website
      dockerfile: Dockerfile.prebuilt
      context: .image
      username: kjuulh
      password:
        from_secret: registry_token
      platforms: linux/amd64
      auto_tag: false
      tags:
        - main-${CI_COMMIT_SHA}

  cache-save:  # ci-cache: managed by kjuulh/woodpecker-forest
    # Saves every wired step's snapshot from the shared workspace (grund-docs design/ci-cache.md).  # ci-cache: managed by kjuulh/woodpecker-forest
    image: alpine:3.22  # ci-cache: managed by kjuulh/woodpecker-forest
    depends_on: [lint, test, release]  # ci-cache: managed by kjuulh/woodpecker-forest
    failure: ignore  # ci-cache: managed by kjuulh/woodpecker-forest
    when:  # ci-cache: managed by kjuulh/woodpecker-forest
      - event: push  # ci-cache: managed by kjuulh/woodpecker-forest
        branch: main  # ci-cache: managed by kjuulh/woodpecker-forest
      - event: manual  # ci-cache: managed by kjuulh/woodpecker-forest
    environment:  # ci-cache: managed by kjuulh/woodpecker-forest
      CICACHE_PASSWORD:  # ci-cache: managed by kjuulh/woodpecker-forest
        from_secret: ci_cache_public  # ci-cache: managed by kjuulh/woodpecker-forest
    commands:  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl 2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl; else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.2.0/ci-cache-0.2.0-x86_64-linux-musl; fi; } 2>/dev/null) && echo "9a8b7b692aaf73f6499de5bca19f15f7609783db03b65bdca252127fea17d36a  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part && mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached"; }'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then ci-cache save-all; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
