# Fast gates for every push and pull request: formatting, lints as errors, the
# unit tests, and the accepttests against a binary cargo spawns. images.yaml
# runs the accepttests again against the release binary it packages, because
# that is the artifact that ships and Woodpecker workflows share no workspace.

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

labels:
  platform: linux/amd64

steps:
  check:
    # The same image images.yaml builds the shipped binary in, so a toolchain
    # difference cannot pass here and fail there.
    image: rust:1.98-alpine
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - apk add --no-cache musl-dev
      - rustup component add rustfmt clippy
      - cargo fmt --all --check
      - cargo clippy --all-targets --locked -- -D warnings
      - cargo test --locked
